services:
  - type: web
    name: oncology-backend
    env: node
    region: oregon
    plan: free
    
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    
    healthCheckPath: /
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000

  - type: web
    name: oncology-frontend
    env: node
    region: oregon
    plan: free
    
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://oncology-backend.onrender.com